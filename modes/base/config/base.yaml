multiball_locks:
    v_lock:
        balls_to_lock: 3
        lock_devices: bd_lock
        locked_ball_counting_strategy: no_virtual
        enable_events: mode_base_started
#        disable_events: multiball_lock_v_lock_full
#        replace_balls_in_play: true
#        balls_to_replace: 2
state_machines:
    rad_meter_status:
        persist_state: true #so this will hold state across balls
        starting_state: rads0
        states:
            rads0:
                label: Start state
                show_when_active:
                    show: rad_level0_show
                    show_tokens: None
            rads1:
                show_when_active:
                    show: rad_level1_show
                    show_tokens: None
            rads2:
                show_when_active:
                    show: rad_level2_show
                    show_tokens: None
            rads3:
                show_when_active:
                    show: rad_level3_show
                    show_tokens: None
            rads4:
                show_when_active:
                    show: rad_level4_show
                    show_tokens: None
            rads5:
                show_when_active:
                    show: rad_level5_show
                    show_tokens: None
            rads6:
                show_when_active:
                    show: rad_level6_show
                    show_tokens: None
            rads7:
                show_when_active:
                    show: rad_level7_show
                    show_tokens: None
            rads8:
                show_when_active:
                    show: rad_level8_show
                    show_tokens: None
            rads9:
                show_when_active:
                    show: rad_level9_show
                    show_tokens: None
            rads10:
                show_when_active:
                    show: rad_level10_show
                    show_tokens: None
                #etc
        transitions:
            - source: rads0
              target: rads1
              events: logicblock_rad_spin_sequence_complete
            - source: rads1
              target: rads2
              events: logicblock_rad_spin_sequence_complete
            - source: rads2
              target: rads3
              events: logicblock_rad_spin_sequence_complete
            - source: rads3
              target: rads4
              events: logicblock_rad_spin_sequence_complete
            - source: rads4
              target: rads5
              events: logicblock_rad_spin_sequence_complete
            - source: rads5
              target: rads6
              events: logicblock_rad_spin_sequence_complete
            - source: rads6
              target: rads7
              events: logicblock_rad_spin_sequence_complete
            - source: rads7
              target: rads8
              events: logicblock_rad_spin_sequence_complete
            - source: rads8
              target: rads9
              events: logicblock_rad_spin_sequence_complete
            - source: rads9
              target: rads10
              events: logicblock_rad_spin_sequence_complete
            - source: rads10
              target: rads0
              events: reset_rad_meter
    med_meter_status:
        persist_state: true #so this will hold state across balls
        starting_state: med0
        states:
            med0:
                label: Start state
                show_when_active:
                    show: med_level0_show
                    show_tokens: None
            med1:
                show_when_active:
                    show: med_level1_show
                    show_tokens: None
            med2:
                show_when_active:
                    show: med_level2_show
                    show_tokens: None
            med3:
                show_when_active:
                    show: med_level3_show
                    show_tokens: None
            med4:
                show_when_active:
                    show: med_level4_show
                    show_tokens: None
            med5:
                show_when_active:
                    show: med_level5_show
                    show_tokens: None
        transitions:
            - source: med0
              target: med1
              events: logicblock_med_spin_sequence_complete
            - source: med1
              target: med2
              events: logicblock_med_spin_sequence_complete
            - source: med2
              target: med3
              events: logicblock_med_spin_sequence_complete
            - source: med3
              target: med4
              events: logicblock_med_spin_sequence_complete
            - source: med4
              target: med5
              events: logicblock_med_spin_sequence_complete
            - source: med5
              target: med0
              events: reset_med_meter

#using show_when_active like this means it will automatically set the lights
#to match the state machine when a new ball starts, without requiring any
#additional logic or event flags

sequences:
    rad_spin_sequence:
        reset_on_complete: true
        disable_on_complete: false
        events:  #counts 5 hits of the rad_spin shot (spinner rotatations)/completion
            - rad_spin_hit
            - rad_spin_hit
            - rad_spin_hit
            - rad_spin_hit
            - rad_spin_hit
            - rad_spin_hit
            - rad_spin_hit
            - rad_spin_hit
            - rad_spin_hit
            - rad_spin_hit
    med_spin_sequence:
        reset_on_complete: true
        disable_on_complete: false
        events:
            - med_spin_hit
            - med_spin_hit
            - med_spin_hit
            - med_spin_hit
            - med_spin_hit
            - med_spin_hit
            - med_spin_hit
            - med_spin_hit
            - med_spin_hit
            - med_spin_hit
            - med_spin_hit
            - med_spin_hit
            - med_spin_hit
            - med_spin_hit
            - med_spin_hit
