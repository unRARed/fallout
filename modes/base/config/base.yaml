counters:
    rad_spin_counter:
        count_events: s_rspinner_active
        starting_count: 0
        count_interval: 1
        count_complete_value: 10
        persist_state: true
        reset_on_complete: true
        disable_on_complete: false

    med_spin_counter:
        count_events: s_lspinner_active
        starting_count: 0
        count_interval: 1
        count_complete_value: 15
        persist_state: true
        reset_on_complete: true
        disable_on_complete: false

    gun_spin_counter:
        count_events: s_cspinner_active
        starting_count: 0
        count_interval: 1
        count_complete_value: 15
        persist_state: true
        reset_on_complete: true
        disable_on_complete: false

