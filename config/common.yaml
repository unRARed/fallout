light_player:
    mode_attract_started:
        rads: BA0000
        caps: white
        shoot_again: lime
        meds: purple
        big_rad: red
        stims: BA0000
        vend: sandy brown
        vlock1: red
        vlock2: ffff00
        vlock3: lime
        helmet: ffff00
        vault_boy: 00D5FF
        slings: yellow

switches:
    s_left_flipper:
        number: 3208-0
        tags: left_flipper
        type: 'NC'
        debounce: quick
    s_right_flipper:
        number: 3208-1
        tags: right_flipper
        type: 'NC'
        debounce: quick
    s_l_stand:
        number: 3208-3
    s_trough_jam:
        number: 3208-27
        type: 'NC'
    s_trough1:
        number: 3208-24
        type: 'NC'
    s_trough2:
        number: 3208-25
        type: 'NC'
    s_trough3:
        number: 3208-26
        type: 'NC'
    s_shooter_lane:
        number: 3208-10
    s_start:
        number: 3208-2
        tags: start
    s_r_outlane:
        number: 3208-18
        tags: playfield_active
    s_left_outlane:
        number: 3208-17
        tags: playfield_active
    s_left_inlane:
        number: 3208-16
        tags: playfield_active
    s_right_inlane:
        number: 3208-19
        tags: playfield_active
    s_left_sling:
        number: 3208-8
    s_right_sling:
        number: 3208-9
    s_right_ramp:
        number: 3208-14
    s_left_ramp:
        number: 0804-7
    s_center_ramp:
        number: 3208-15
    s_stand_up1:
        number: 3208-11
    s_stand_up2:
        number: 3208-12
    s_stand_up3:
        number: 3208-13
    s_scoop:
        number: 0804-3
        type: 'NC'
    s_lspinner:
        number: 0804-0
        type: 'NC'
        debounce: quick
    s_cspinner:
        number: 0804-1
        type: 'NC'
        debounce: quick
    s_rspinner:
        number: 0804-2
        type: 'NC'
        tags:
          - rad_spin
        debounce: quick
    s_lock1:
        number: 0804-4
        type: 'NC'
    s_lock2:
        number: 0804-5
        type: 'NC'
    s_lock3:
        number: 0804-6
        type: 'NC'
spinners:
    basic_spinner:
       switch: s_rspinner, s_lspinner, s_cspinner
       active_ms: 1000

coils:
    c_flipper_left_main:
        number: 3208-0
        allow_enable: true
        default_pulse_ms: 20
        default_hold_power: .25

    c_flipper_right_main:
        number: 3208-1
        allow_enable: true
        default_pulse_ms: 20
        default_hold_power: .25

    c_plunger:
        number: 3208-6
        default_pulse_ms: 14
    c_trough_eject:
        number: 3208-7
        default_pulse_ms: 14
    c_sling_left:
        number: 3208-4
        default_pulse_ms: 12
    c_sling_right:
        number: 3208-5
        default_pulse_ms: 12
    c_scoop:
        number: 3208-3
        default_pulse_ms: 12
    c_lock:
        number: 3208-2
        default_pulse_ms: 22
    c_uv:
        number: 0804-0
        allow_enable: true
        default_pulse_ms: 25
        max_pulse_power: 1
        max_pulse_ms: 1000

coil_player:
    mode_attract_started:
        c_uv:
            action: enable
            hold_power: 1

ball_devices:
    bd_trough:
        ball_switches: s_trough1, s_trough2, s_trough3, s_trough_jam
        eject_coil: c_trough_eject
        eject_targets: bd_plunger
        eject_timeouts: 3s
        tags: trough, home, drain
        jam_switch: s_trough_jam
        eject_coil_jam_pulse: 15ms
        debug: true
    bd_plunger:
        ball_switches: s_shooter_lane
        eject_coil: c_plunger
        mechanical_eject: true
        eject_timeouts: 3s
    bd_scoop:
        ball_switches: s_scoop
        eject_coil: c_scoop
        mechanical_eject: true
        eject_timeouts: 1s
    bd_lock:
        ball_switches: s_lock1, s_lock2, s_lock3
        eject_coil: c_lock
        eject_all_events: multiball_vault_multiball_started
#        eject_timeouts: 1s

counters:
    mb_counter:
        count_events: mode_base_active
        count_complete_value: 3
autofire_coils:
    ac_slingshot_left:
        coil: c_sling_left
        switch: s_left_sling
    ac_slingshot_right:
        coil: c_sling_right
        switch: s_right_sling
    ac_uv:
        coil: c_uv
        switch: s_rspinner

playfields:
    playfield:
        tags: default
        default_source_device: bd_plunger
        enable_ball_search: true
        ball_search_timeout: 15s
        ball_search_wait_after_iteration: 10s
        ball_search_interval: 250ms

flippers:
#these flippers are setup for dual-wound coils, computer controlled
#to switch from high power to hold power automatically when the flipper button
#is held down --no end of stroke switch required
    left_flipper:
        main_coil: c_flipper_left_main
        activation_switch: s_left_flipper
    right_flipper:
        main_coil: c_flipper_right_main
        activation_switch: s_right_flipper

sound_system:
    buffer: 1024
    channels: 1
    enabled: true
    frequency: 44100
    tracks:
        music:
            type: standard
            simultaneous_sounds: 1
            volume: 0.8
        voice:
            type: standard
            simultaneous_sounds: 1
            volume: 0.9
        sfx:
            type: standard
            simultaneous_sounds: 8
            volume: 0.8

sound_player:
    mode_attract_started:
      crawlout:
        action: play
        loops: -1
    mode_attract_stopped:
      crawlout:
        action: stop
    s_rspinner_active: geiger_sfx

    mode_base_started:
      combat_ready:
        action: play
        loops: -1
        volume: .9
    mode_base_stopped:
      combat_ready: stop
      action: stop
      better_go:
        action: play
        loops: 0
        volume: .9

sounds:
    base_start_1:
        file: position.flac
        volume: 10
    base_start_2:
        file: replacement.flac
        volume: 10
    base_start_3:
        file: good_morning.flac
        volume: 10
    base_start_4:
        file: move_it.flac
        volume: 10
    base_end_1:
        file: maggot.flac
        volume: 10
    base_end_2:
        file: better_go.ogg
        volume: 10
    base_end_3:
        file: out_of_face.flac
        volume: 10
    base_end_4:
        file: absurd.flac
        volume: 10

sound_pools:
    base_start:
        type: random
        track: voice
        sounds:
            - base_start_1|3
            - base_start_2|3
            - base_start_3|3
            - base_start_4|3
    base_end:
        type: random
        track: voice
        sounds:
            - base_end_1|3
            - base_end_2|3
            - base_end_3|3
            - base_end_4|3

machine_vars:
    master_volume:
        initial_value: 0.8

player_vars:
    spinner_hits:
        initial_value: 0

modes:
    - base
#    - bonus
    - high_score
    - attract

widget_player:
    player_added{num==1}:
        player1_scoring:
            slide: base_slide
    player_added{num==2}:
        player2_scoring:
            slide: base_slide
    player_added{num==3}:
        player3_scoring:
            slide: base_slide
    player_added{num==4}:
        player4_scoring:
            slide: base_slide

