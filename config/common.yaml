kivy_config:
    kivy:
        desktop: 1
        exit_on_escape: true
        pause_on_minimize: 0
    graphics:
        window_state: visible # visible, hidden, maximized, minimized
        fbo: software # hardware, software, force-hardware
        maxfps: 30
        multisamples: 2
        rotation: 0

displays:
    display1:
      width: 1920
      height: 1080
      default: true
#    display2:
#      width: 1280
#      height: 720
#    combined_display:
#      width: 2646
#      height: 768

slides:
#    dual_screen_slide:
#        - type: display
#          source_display: display1
#          width: 1366
#          height: 768
#          x: left
#          anchor_x: left
#        - type: display
#          source_display: display2
#          width: 1280
#          height: 720
#          x: right
#          anchor_x: right
    dspc_animation_slide:
        target: display1
        widgets:
            - type: video
              video: dspc-animation
    welcome_slide:
        target: display1
        widgets:
            - type: text
              text: IF YOU SEE THIS, SOMETHING IS WRONG!
              font_size: 50
              color: red
            - type: rectangle
              width: 240
              height: 60
              x: left
              anchor_x: left
    attract_slide1:
        target: display1
        widgets:
            - type: image
              image: stand_by
              scale: 3
    attract_slide2:
        widgets:
            - type: image
              image: wheel
              scale: 2
    attract_slide3:
        widgets:
            - type: image
              image: fallout_new
              scale: 3
    final_score_slide:
        widgets:
            - type: text
              text: FINAL SCORE
              font_size: 42
              color: black
              y: 900
              x: 1120
              anchor_x: left
              anchor_y: top
            - type: image
              image: final_score
    base_slide:
        widgets:
            - type: text
              font_name: Wideg
              text: (score)
              number_grouping: true
              min_digits: 2
              font_size: 45
              color: yellow
              y: 1000
              x: 1000
              z: 10
              anchor_x: right
              anchor_y: bottom
            - type: text
              font_name: Wideg
              text: PLAYER (number)
              y: 1000
              x: 20
              z: 10
              font_size: 50
              color: yellow
              anchor_x: left
              anchor_y: bottom
            - type: text
              font_name: Wideg
              text: BALL (ball)
              color: yellow
              y: 900
              x: 20
              z: 10
              anchor_x: left
              anchor_y: bottom
              font_size: 50
            - type: image
              image: fallout_ui_clear
              z: 5
              x: right
              anchor_x: right
            - type: image
              image: nuke1
              z: 1
              scale: .5
