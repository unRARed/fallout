keyboard:
    s:
        switch: s_start
    z:
        switch: s_left_flipper
    "/":
        switch: s_right_flipper
    1:
        switch: s_trough1
    2:
        switch: s_trough2
    3:
        switch: s_trough3
    l:
        switch: s_shooter_lane
